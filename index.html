<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习日记</title>
<script>
  (function () {
    var saved = localStorage.getItem("learn-theme");
    var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  })();
</script>
<style>
  :root {
    --bg: #fdfaf5; --card: #ffffff; --border: #e5dccf; --border-2: #d6c9b6;
    --text: #33302b; --sub: #7a736a; --faint: #a49c91;
    --accent: #c2703d; --accent-soft: #faede3;
    --shadow: 0 2px 12px rgba(51,48,43,.06);
  }
  [data-theme="dark"] {
    --bg: #1c1a17; --card: #262320; --border: #38332d; --border-2: #4a443c;
    --text: #ece6dd; --sub: #a49c91; --faint: #7a736a;
    --accent: #e0925f; --accent-soft: #3a2b20;
    --shadow: 0 2px 12px rgba(0,0,0,.3);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 32px 20px 60px; }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  h1 { margin: 0 0 4px; font-size: 26px; font-weight: 500; }
  .sub { margin: 0; color: var(--sub); font-size: 14px; }
  .icon-btn {
    background: var(--card); color: var(--text); border: 0.5px solid var(--border);
    border-radius: 8px; width: 38px; height: 38px; font-size: 16px; cursor: pointer;
  }
  .icon-btn:hover { border-color: var(--border-2); }
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .metric { background: var(--card); border: 0.5px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .metric p { margin: 0; }
  .metric .lab { font-size: 12px; color: var(--sub); margin-bottom: 4px; }
  .metric .num { font-size: 24px; font-weight: 500; }
  .bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
  input[type=text] {
    flex: 1; min-width: 200px; padding: 9px 12px; font-size: 14px;
    background: var(--card); color: var(--text);
    border: 0.5px solid var(--border); border-radius: 8px; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  .chip {
    padding: 9px 14px; font-size: 14px; cursor: pointer;
    background: var(--card); color: var(--sub);
    border: 0.5px solid var(--border); border-radius: 8px;
  }
  .chip.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .day { margin-bottom: 36px; }
  .day-head { display: flex; align-items: baseline; gap: 12px; margin: 0 0 14px; }
  .day-head h2 { margin: 0; font-size: 18px; font-weight: 500; }
  .day-head a { color: var(--accent); text-decoration: none; font-size: 14px; }
  .day-head a:hover { text-decoration: underline; }
  .day-head .cnt { font-size: 13px; color: var(--faint); }
  .daycard {
    background: var(--card); border: 0.5px solid var(--border);
    border-radius: 12px; padding: 18px 20px; box-shadow: var(--shadow);
  }
  .daycard:hover { border-color: var(--border-2); }
  .lead { margin: 0 0 16px; font-size: 14px; color: var(--sub); }
  .secs { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
  .sec { border-top: 0.5px solid var(--border); padding-top: 12px; }
  .sec .cat { font-size: 12px; color: var(--accent); margin: 0 0 6px; }
  .sec h3 { margin: 0 0 8px; font-size: 16px; font-weight: 500; }
  .sec ul { margin: 0 0 12px; padding-left: 18px; font-size: 13px; color: var(--sub); }
  .sec ul li { margin-bottom: 3px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--sub); }
  .todo {
    display: flex; align-items: center; gap: 10px; padding: 11px 14px; margin-bottom: 8px;
    background: var(--card); border: 0.5px solid var(--border); border-radius: 10px; font-size: 14px;
  }
  .todo.done span { text-decoration: line-through; color: var(--faint); }
  .todo input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  .todo span { cursor: pointer; }
  .todo-lab { font-size: 13px; color: var(--faint); margin: 16px 0 8px; }
  .empty { color: var(--faint); font-size: 14px; padding: 12px 0; }
  footer { margin-top: 40px; padding-top: 16px; border-top: 0.5px solid var(--border); font-size: 13px; color: var(--faint); }
  @media (max-width: 600px) { .metrics { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>学习日记</h1>
      <p class="sub">一天一份，扫一眼就知道学了什么</p>
    </div>
    <button class="icon-btn" id="theme-btn" title="切换深浅色">◐</button>
  </header>

  <div class="metrics">
    <div class="metric"><p class="lab">天数</p><p class="num" id="m-days">0</p></div>
    <div class="metric"><p class="lab">知识点</p><p class="num" id="m-notes">0</p></div>
    <div class="metric"><p class="lab">待办</p><p class="num" id="m-todos">0</p></div>
  </div>

  <div class="bar">
    <input type="text" id="search" placeholder="搜日期、主题、要点或关键词">
    <div id="cats" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
  </div>

  <div id="days"></div>
  <p class="empty" id="empty" style="display:none">没有匹配的内容</p>

  <footer>
    每天一个文件，按日期命名 · 新增日记后让我重新生成这一页
  </footer>
</div>

<script>
/* 一天一张卡片：sections 是当天所有知识点，卡片内部按小节排 */
var DAYS = [
  {
    date: "2026-09-11",
    file: "2026-09-11.md",
    lead: "今天把命令行基础补齐：搞懂大模型本质，学会 cd / ls / mv，又补了 mkdir 建目录与 touch 建空文件。命令部分全部在 /tmp 实测过。",
    sections: [
      {
        cat: "概念",
        title: "大模型是什么",
        points: [
          "海量文本喂出来的「概率续写机」：一个词一个词地预测下一个词",
          "三个关键词：参数（7B/70B，B = 十亿）、预训练、自回归生成",
          "会幻觉、会过时，不真懂世界，要你把关",
          "比喻：大模型 = 大哥（只动嘴）；Agent = 外挂身体 + 秘书团队 + 工具箱（让大哥能想也能做）"
        ],
        tags: ["参数", "预训练", "幻觉", "Agent"]
      },
      {
        cat: "命令行",
        title: "cd 切换目录",
        points: [
          "cd 不带参数直接回 ~（家目录）",
          "cd - 在上一次目录和当前目录间来回跳",
          "只换自己的位置，不动任何文件（和 mv 正好相反）"
        ],
        tags: ["cd -", "cd ..", "绝对/相对路径"]
      },
      {
        cat: "命令行",
        title: "ls 列出目录内容",
        points: [
          "ls -la 看全部（含隐藏）+ 详情，排查最常用",
          "macOS 上色用 -G，写 --color 不报错但被静默忽略",
          "长格式首位：- 是文件，d 是目录"
        ],
        tags: ["-la", "-G", "BSD 差异"]
      },
      {
        cat: "命令行",
        title: "mv 移动与改名",
        points: [
          "最后一个参数是目录就移动、是文件名就改名",
          "默认静默覆盖、不打招呼，防丢用 -i 或 -n",
          "macOS 是 BSD 版，没有 -b 备份（写 -b 直接报 illegal option）",
          "-v 显示从→到过程，多文件一起移进目录很直观"
        ],
        tags: ["-i -n", "静默覆盖", "BSD 差异"]
      },
      {
        cat: "命令行",
        title: "mkdir 新建目录",
        points: [
          "mkdir -p 父/子/孙 一次建多层，自动补中间目录",
          "不加 -p 建多层会报错：No such file or directory",
          "-v 建的时候回显目录名（macOS 实测支持）"
        ],
        tags: ["-p", "嵌套", "BSD 差异"]
      },
      {
        cat: "命令行",
        title: "touch 建空文件/刷时间",
        points: [
          "touch 不存在的文件 → 建 0 字节空文件",
          "touch 已有文件 → 只刷新修改时间，不动内容",
          "-c 文件不存在就不建，避免误建；也能 touch 目录刷时间"
        ],
        tags: ["空文件", "-c", "时间戳"]
      }
    ],
    todos: []
  },
  {
    date: "2026-09-10",
    file: "2026-09-10.md",
    lead: "今天两件事：搞懂 mv 的移动/改名（以及它的静默覆盖风险）、弄清 WorkBuddy 工作空间怎么建。mv 的行为是先在 /tmp 跑过才写的。",
    sections: [
      {
        cat: "命令行",
        title: "mv 移动与重命名",
        points: [
          "同分区只改目录项，inode 全程不变，100GB 也是瞬间完成",
          "默认静默覆盖、不打招呼，建议 alias mv='mv -i'",
          "macOS 是 BSD 版，没有 -u 和 -b"
        ],
        tags: ["inode", "-i -n -v", "BSD 差异"]
      },
      {
        cat: "工具",
        title: "WorkBuddy 工作空间",
        points: [
          "工作空间就是个文件夹，入口在输入框左下角「选择工作空间」",
          "不指定就按时间戳生成目录（如 2026-09-10-22-16-01），过一周就认不出",
          ".workbuddy 是项目数据不是缓存，别删；三层：项目记忆 / 用户全局 / 身份设定"
        ],
        tags: ["选择工作空间", ".workbuddy", "三层记忆"]
      }
    ],
    todos: []
  }
];

var state = { cat: "全部", q: "" };
var $ = function (id) { return document.getElementById(id); };

function loadDone() {
  try { return JSON.parse(localStorage.getItem("learn-todos")) || {}; } catch (e) { return {}; }
}
function saveDone(m) { localStorage.setItem("learn-todos", JSON.stringify(m)); }
var doneMap = loadDone();

function allCats() {
  var c = ["全部"];
  DAYS.forEach(function (d) {
    d.sections.forEach(function (s) { if (c.indexOf(s.cat) < 0) c.push(s.cat); });
  });
  return c;
}

function hit(s, q) {
  if (!q) return true;
  var hay = (s.cat + s.title + s.points.join("") + s.tags.join("")).toLowerCase();
  return hay.indexOf(q) >= 0;
}

function renderCats() {
  var box = $("cats");
  box.innerHTML = "";
  allCats().forEach(function (c) {
    var b = document.createElement("button");
    b.className = "chip" + (state.cat === c ? " on" : "");
    b.textContent = c;
    b.onclick = function () { state.cat = c; render(); };
    box.appendChild(b);
  });
}

function renderDays() {
  var box = $("days");
  box.innerHTML = "";
  var q = state.q.toLowerCase();
  var shown = 0;

  DAYS.forEach(function (d) {
    var dateHit = !q || d.date.indexOf(q) >= 0;
    var secs = d.sections.filter(function (s) {
      if (state.cat !== "全部" && s.cat !== state.cat) return false;
      return hit(s, q) || (dateHit && q);
    });
    if (!secs.length) return;
    shown++;

    var sec = document.createElement("div");
    sec.className = "day";
    var head = document.createElement("div");
    head.className = "day-head";
    var cnt = secs.length === d.sections.length
      ? d.sections.length + " 个知识点"
      : "筛出 " + secs.length + " / " + d.sections.length + " 个";
    head.innerHTML =
      "<h2>" + d.date + "</h2>" +
      '<span class="cnt">' + cnt + "</span>" +
      '<a href="' + d.file + '">看原文</a>';
    sec.appendChild(head);

    var card = document.createElement("div");
    card.className = "daycard";
    card.innerHTML = '<p class="lead">' + d.lead + "</p>";

    var box2 = document.createElement("div");
    box2.className = "secs";
    secs.forEach(function (s) {
      var item = document.createElement("div");
      item.className = "sec";
      var ul = s.points.map(function (p) { return "<li>" + p + "</li>"; }).join("");
      var tg = s.tags.map(function (t) { return '<span class="tag">' + t + "</span>"; }).join("");
      item.innerHTML =
        '<p class="cat">' + s.cat + "</p>" +
        "<h3>" + s.title + "</h3>" +
        "<ul>" + ul + "</ul>" +
        '<div class="tags">' + tg + "</div>";
      box2.appendChild(item);
    });
    card.appendChild(box2);
    sec.appendChild(card);

    if (d.todos && d.todos.length && (state.cat === "全部")) {
      var lab = document.createElement("p");
      lab.className = "todo-lab";
      lab.textContent = "还没做完的";
      sec.appendChild(lab);
      d.todos.forEach(function (t, i) {
        var key = d.date + "#" + i;
        var done = !!doneMap[key];
        var row = document.createElement("div");
        row.className = "todo" + (done ? " done" : "");
        var cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = done;
        cb.onchange = function () {
          doneMap[key] = cb.checked;
          saveDone(doneMap);
          row.className = "todo" + (cb.checked ? " done" : "");
          updateMetrics();
        };
        var sp = document.createElement("span");
        sp.textContent = t;
        sp.onclick = function () { cb.checked = !cb.checked; cb.onchange(); };
        row.appendChild(cb);
        row.appendChild(sp);
        sec.appendChild(row);
      });
    }

    box.appendChild(sec);
  });

  $("empty").style.display = shown ? "none" : "block";
}

function updateMetrics() {
  var cats = allCats().length - 1;
  var n = 0, t = 0;
  DAYS.forEach(function (d) {
    n += d.sections.length;
    (d.todos || []).forEach(function (_, i) { if (!doneMap[d.date + "#" + i]) t++; });
  });
  $("m-days").textContent = DAYS.length;
  $("m-notes").textContent = n;
  $("m-todos").textContent = t;
}

function render() { renderCats(); renderDays(); }

$("search").oninput = function (e) { state.q = e.target.value; renderDays(); };

$("theme-btn").onclick = function () {
  var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("learn-theme", next);
};

updateMetrics();
render();
</script>
</body>
</html>
